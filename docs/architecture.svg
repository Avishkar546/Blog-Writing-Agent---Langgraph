<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Blog Generator application architecture</title>
  <desc id="desc">React browser connects through Nginx to FastAPI and LangGraph. The API uses Groq, Tavily, Cloudflare Workers AI, and PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#567086"/></marker>
    <style>
      .bg{fill:#f5f8fc}.box{fill:#fff;stroke:#b9cadb;stroke-width:2;rx:16}.primary{fill:#e9f2ff;stroke:#6290cc}.external{fill:#fff6e8;stroke:#d6a44a}.db{fill:#ebf8f1;stroke:#62a77f}.title{font:700 18px system-ui,sans-serif;fill:#18334c}.sub{font:14px system-ui,sans-serif;fill:#4e657a}.arrow{stroke:#567086;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.label{font:12px system-ui,sans-serif;fill:#4e657a}
    </style>
  </defs>
  <rect class="bg" width="1120" height="560" rx="20"/>
  <text x="40" y="44" class="title">Blog Generator — deployable application architecture</text>
  <rect x="48" y="100" width="190" height="108" class="box primary"/>
  <text x="143" y="140" text-anchor="middle" class="title">React + Vite</text>
  <text x="143" y="166" text-anchor="middle" class="sub">Generate · browse · read</text>
  <text x="143" y="187" text-anchor="middle" class="sub">Markdown viewer</text>

  <rect x="315" y="100" width="190" height="108" class="box"/>
  <text x="410" y="140" text-anchor="middle" class="title">Nginx</text>
  <text x="410" y="166" text-anchor="middle" class="sub">Static frontend</text>
  <text x="410" y="187" text-anchor="middle" class="sub">/api reverse proxy</text>

  <rect x="580" y="80" width="230" height="150" class="box primary"/>
  <text x="695" y="120" text-anchor="middle" class="title">FastAPI</text>
  <text x="695" y="148" text-anchor="middle" class="sub">Request validation · REST</text>
  <text x="695" y="170" text-anchor="middle" class="sub">SQLAlchemy · migrations</text>
  <text x="695" y="197" text-anchor="middle" class="sub">Pydantic contracts</text>

  <rect x="580" y="320" width="230" height="130" class="box primary"/>
  <text x="695" y="360" text-anchor="middle" class="title">LangGraph</text>
  <text x="695" y="388" text-anchor="middle" class="sub">Router · research · planner</text>
  <text x="695" y="410" text-anchor="middle" class="sub">Writer · reducer · image</text>

  <rect x="890" y="68" width="180" height="92" class="box db"/>
  <text x="980" y="106" text-anchor="middle" class="title">PostgreSQL</text>
  <text x="980" y="133" text-anchor="middle" class="sub">Blogs · plans · images</text>
  <rect x="890" y="200" width="180" height="82" class="box external"/>
  <text x="980" y="235" text-anchor="middle" class="title">Groq</text>
  <text x="980" y="259" text-anchor="middle" class="sub">Routing · writing · plan</text>
  <rect x="890" y="320" width="180" height="82" class="box external"/>
  <text x="980" y="355" text-anchor="middle" class="title">Tavily</text>
  <text x="980" y="379" text-anchor="middle" class="sub">Web research</text>
  <rect x="890" y="440" width="180" height="82" class="box external"/>
  <text x="980" y="475" text-anchor="middle" class="title">Cloudflare AI</text>
  <text x="980" y="499" text-anchor="middle" class="sub">Optional image output</text>

  <path class="arrow" d="M238 154H315"/>
  <text x="272" y="143" text-anchor="middle" class="label">HTTP</text>
  <path class="arrow" d="M505 154H580"/>
  <text x="542" y="143" text-anchor="middle" class="label">/api</text>
  <path class="arrow" d="M695 230V320"/>
  <text x="707" y="279" class="label">invoke</text>
  <path class="arrow" d="M810 120H890"/>
  <text x="850" y="108" text-anchor="middle" class="label">read/write</text>
  <path class="arrow" d="M810 350C850 350 850 241 890 241"/>
  <path class="arrow" d="M810 385H890"/>
  <path class="arrow" d="M810 418C850 418 850 481 890 481"/>
</svg>
