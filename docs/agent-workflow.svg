<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
  <title id="title">Blog Generator LangGraph agent workflow</title>
  <desc id="desc">The parent graph routes a topic, optionally researches it, plans and writes the blog, then invokes a reducer subgraph containing merge, image planning, and image generation. Cloudflare image generation is optional.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#567086"/></marker>
    <style>
      .bg{fill:#f5f8fc}.box{fill:#fff;stroke:#b9cadb;stroke-width:2;rx:14}.choice{fill:#eaf1ff;stroke:#6290cc;stroke-width:2}.optional{fill:#fff6e8;stroke:#d6a44a;stroke-width:2}.end{fill:#ebf8f1;stroke:#62a77f;stroke-width:2}.group{fill:#f0f5ff;fill-opacity:.75;stroke:#7796c2;stroke-width:2;stroke-dasharray:8 6;rx:20}.t{font:700 16px system-ui,sans-serif;fill:#18334c}.s{font:13px system-ui,sans-serif;fill:#4e657a}.a{stroke:#567086;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.l{font:12px system-ui,sans-serif;fill:#4e657a}
    </style>
  </defs>
  <rect class="bg" width="1280" height="610" rx="20"/>
  <text x="36" y="42" class="t" style="font-size:20px">LangGraph workflow — final reducer runs as a compiled subgraph</text>

  <rect x="35" y="235" width="125" height="82" class="box"/>
  <text x="97" y="270" text-anchor="middle" class="t">Topic</text>
  <text x="97" y="294" text-anchor="middle" class="s">API request</text>
  <rect x="205" y="235" width="145" height="82" class="choice"/>
  <text x="277" y="270" text-anchor="middle" class="t">Router</text>
  <text x="277" y="294" text-anchor="middle" class="s">mode + queries</text>
  <rect x="410" y="72" width="180" height="88" class="optional"/>
  <text x="500" y="108" text-anchor="middle" class="t">Researcher</text>
  <text x="500" y="133" text-anchor="middle" class="s">Tavily · up to 3 queries</text>
  <rect x="410" y="235" width="180" height="82" class="box"/>
  <text x="500" y="270" text-anchor="middle" class="t">Planner</text>
  <text x="500" y="294" text-anchor="middle" class="s">5 structured tasks</text>
  <rect x="650" y="235" width="145" height="82" class="box"/>
  <text x="722" y="270" text-anchor="middle" class="t">Writer</text>
  <text x="722" y="294" text-anchor="middle" class="s">Markdown sections</text>

  <rect x="835" y="70" width="410" height="370" class="group"/>
  <text x="855" y="102" class="t">Reducer subgraph</text>
  <text x="855" y="123" class="s">One compiled child graph mounted at parent node “reducer”</text>
  <rect x="870" y="165" width="145" height="88" class="box"/>
  <text x="942" y="202" text-anchor="middle" class="t">merge</text>
  <text x="942" y="226" text-anchor="middle" class="s">final Markdown</text>
  <rect x="1045" y="165" width="165" height="88" class="optional"/>
  <text x="1127" y="202" text-anchor="middle" class="t">plan_image</text>
  <text x="1127" y="226" text-anchor="middle" class="s">zero or one image</text>
  <rect x="955" y="310" width="175" height="88" class="end"/>
  <text x="1042" y="347" text-anchor="middle" class="t">generate_and_save</text>
  <text x="1042" y="371" text-anchor="middle" class="s">image payload + result</text>

  <rect x="885" y="495" width="270" height="78" class="optional"/>
  <text x="1020" y="528" text-anchor="middle" class="t">Cloudflare Workers AI</text>
  <text x="1020" y="551" text-anchor="middle" class="s">Optional image-generation service</text>

  <path class="a" d="M160 276H205"/>
  <path class="a" d="M350 250C380 250 380 116 410 116"/>
  <text x="354" y="190" class="l">research=true</text>
  <path class="a" d="M350 294H410"/>
  <text x="355" y="285" class="l">otherwise</text>
  <path class="a" d="M500 160V235"/>
  <text x="511" y="203" class="l">evidence</text>
  <path class="a" d="M590 276H650"/>
  <path class="a" d="M795 276H830"/>
  <text x="810" y="264" class="l">invoke reducer</text>
  <path class="a" d="M1015 209H1045"/>
  <path class="a" d="M1127 253C1127 280 1100 290 1070 310"/>
  <path class="a" d="M1042 398V495"/>
  <text x="1055" y="455" class="l">when configured</text>

  <text x="36" y="585" class="s">Groq powers routing, planning, writing, and image planning. The API service persists the subgraph’s final Markdown and optional image in PostgreSQL.</text>
</svg>
